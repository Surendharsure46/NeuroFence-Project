[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurofence"
version = "0.1.0"
description = "Offline LLM weight poisoning & backdoor scanner — Phase 1 foundation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Aerovant Technologies" }]
keywords = ["llm", "security", "model-forensics", "backdoor", "activation-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]

dependencies = [
  "torch>=2.2",
  "transformers>=4.40",
  "safetensors>=0.4",
  "PyYAML>=6.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
gui = ["PyQt6>=6.6", "matplotlib>=3.8", "reportlab>=4.0"]
report = ["matplotlib>=3.8", "reportlab>=4.0"]
viz = ["matplotlib>=3.8"]
hub = ["huggingface-hub>=0.23"]

[project.scripts]
neurofence-inspect = "neurofence.cli:inspect_main"

[project.gui-scripts]
neurofence-desktop = "neurofence.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "slow: tests that load a model (deselect with -m 'not slow')",
  "integration: end-to-end pipeline tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
# Nested `with` around pytest.raises keeps the assertion scope explicit,
# which matters when the outer context is the sandbox under test.
"tests/*" = ["E501", "SIM117"]
"scripts/*" = ["E402"]

[tool.coverage.run]
source = ["src/neurofence"]
